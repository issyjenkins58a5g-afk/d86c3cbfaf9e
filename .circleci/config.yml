    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List node pods
          command: |
            printf 'pod-a\npod-b\n' > pods.txt
      - run:
          name: Build node controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target k8s-drain -j2
      - run:
          name: Drain node gracefully
          command: LIONSS_LP=1 ./build/k8s-drain --pods pods.txt --grace 30
